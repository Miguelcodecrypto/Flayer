app = "flayer-vales"
primary_region = "mad"

[build]
  image = "ghcr.io/muchobien/pocketbase:latest"

[env]
  POCKETBASE_VERSION = "0.22.27"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "pb_data"
  destination = "/pb_data"
